name: Release

# Publishing a GitHub Release (tag vX.Y.Z) publishes that version to npm and attaches the Claude Desktop Extension.
# npm auth is Trusted Publishing (OIDC): no token secret; npmjs.com → backlog-bridge → Settings → Trusted Publisher
# must name this repository and `release.yml`. Provenance is added automatically.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload the .mcpb to the release
      id-token: write   # npm Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm >= 11.5.1, which Trusted Publishing needs (no unpinned `npm install -g npm`).
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm --version
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ and plugin/ are up to date with src/
        run: |
          if ! git diff --exit-code -- dist plugin || [ -n "$(git status --porcelain -- plugin)" ]; then
            echo "dist/ or plugin/ is stale - run npm run build and commit it"
            exit 1
          fi
      - name: Attach the Claude Desktop Extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/pack-mcpb.mjs
          gh release upload "$GITHUB_REF_NAME" build/backlog-bridge-*.mcpb --clobber
      - name: Publish to npm
        env:
          # A GitHub pre-release goes to the `next` dist-tag, so `npm install backlog-bridge` keeps getting the stable one.
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "backlog-bridge@$version" version >/dev/null 2>&1; then
            echo "backlog-bridge@$version is already on npm - skipping"
          else
            npm publish --tag "$DIST_TAG"
          fi
