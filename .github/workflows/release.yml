name: Release

# Publishing a GitHub Release (tag vX.Y.Z) publishes that version to npm and attaches the Claude Desktop Extension
# with a signed build-provenance attestation (Sigstore). npm auth is Trusted Publishing (OIDC): no token secret;
# npmjs.com → backlog-bridge → Settings → Trusted Publisher must name this repository and `release.yml`.
#
# Run it by hand (Actions → Release → Run workflow, tag vX.Y.Z) to rebuild and sign the .mcpb of an existing
# release from its tag; npm is left alone then.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and sign the .mcpb for (vX.Y.Z)
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload the .mcpb and its signature to the release
      id-token: write       # npm Trusted Publishing + Sigstore signing
      attestations: write   # build-provenance attestation
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm >= 11.5.1, which Trusted Publishing needs (no unpinned `npm install -g npm`).
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm --version
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ and plugin/ are up to date with src/
        run: |
          if ! git diff --exit-code -- dist plugin || [ -n "$(git status --porcelain -- plugin)" ]; then
            echo "dist/ or plugin/ is stale - run npm run build and commit it"
            exit 1
          fi
      - name: Build the Claude Desktop Extension
        run: node scripts/pack-mcpb.mjs
      - name: Sign it (build provenance, Sigstore)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/backlog-bridge-*.mcpb
      - name: Attach the extension and its signature bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mcpb=$(ls build/backlog-bridge-*.mcpb)
          cp "$BUNDLE" "$mcpb.sigstore.json"
          gh release upload "$TAG" "$mcpb" "$mcpb.sigstore.json" --clobber
      - name: Publish to npm
        if: github.event_name == 'release'
        env:
          # A GitHub pre-release goes to the `next` dist-tag, so `npm install backlog-bridge` keeps getting the stable one.
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "backlog-bridge@$version" version >/dev/null 2>&1; then
            echo "backlog-bridge@$version is already on npm - skipping"
          else
            npm publish --tag "$DIST_TAG"
          fi
