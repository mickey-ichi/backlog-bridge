name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ is up to date with src/
        run: |
          if ! git diff --exit-code -- dist; then
            echo "dist/ is stale - run npm run build and commit it"
            exit 1
          fi
      - name: Smoke test
        run: |
          ./bin/backlog-bridge | head -3
          ./bin/backlog-bridge sync --list
          ./bin/backlog-bridge mcp --config
          node dist/cli.js home
          HOME="$RUNNER_TEMP/home" ./bin/backlog-bridge setup
          HOME="$RUNNER_TEMP/home" ./bin/backlog-bridge setup --uninstall

  # npm entry point + tests on the other platforms (the POSIX launcher and dist/ freshness are checked above).
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke test via the npm launcher
        env:
          HOME: ${{ runner.temp }}/home
          USERPROFILE: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME/.claude"
          node bin/backlog-bridge.js --version
          node bin/backlog-bridge.js sync --list
          node bin/backlog-bridge.js mcp --config
          node bin/backlog-bridge.js setup
          node bin/backlog-bridge.js spaces
          node bin/backlog-bridge.js setup --uninstall
