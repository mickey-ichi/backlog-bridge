name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ is up to date with src/
        run: |
          if ! git diff --exit-code -- dist; then
            echo "dist/ is stale - run npm run build and commit it"
            exit 1
          fi
      - name: Smoke test
        run: |
          ./bin/backlog-bridge | head -3
          ./bin/backlog-bridge sync --list
          ./bin/backlog-bridge mcp --config
          node dist/cli.js home
          HOME="$RUNNER_TEMP/home" ./bin/backlog-bridge setup
          HOME="$RUNNER_TEMP/home" ./bin/backlog-bridge setup --uninstall
