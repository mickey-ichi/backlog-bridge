name: MCP Registry

# Publishes server.json to the Official MCP Registry. The registry checks that the npm package of that version carries
# the same mcpName, so this waits until npm serves the version first. GitHub OIDC login: no secret.
# Runs after each stable GitHub Release; run it by hand (Actions → MCP Registry) to retry.
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait until npm serves this version
        run: |
          pkg=$(node -p "require('./package.json').name"); ver=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null "https://registry.npmjs.org/$pkg/$ver"; then echo "$pkg@$ver is on npm"; exit 0; fi
            sleep 15
          done
          echo "$pkg@$ver is not on npm after 10 minutes"; exit 1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Publish server.json
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
